<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NextGen Pipeline</title>
<style>
  :root{
    --bg:#F4F6F3; --surface:#FFFFFF; --surface2:#EDF1EC;
    --ink:#1B2620; --muted:#5C6B62; --line:#DCE3DC; --line-strong:#C3CDC3;
    --accent:#17735A; --accent-ink:#FFFFFF; --accent-soft:#E1EFE8;
    --danger:#A83A32; --warn:#B07A18; --ok:#2E7D5B;
    --st-prospect:#5B7A99; --st-lead:#2E8C86; --st-demo:#B07A18; --st-closed:#17735A; --st-reengage:#7A5E9E;
    --shadow:0 1px 2px rgba(27,38,32,.06), 0 4px 16px rgba(27,38,32,.07);
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141A17; --surface:#1C2420; --surface2:#232D28;
      --ink:#E7EDE7; --muted:#93A399; --line:#2B362F; --line-strong:#3B473F;
      --accent:#41BD95; --accent-ink:#0E1512; --accent-soft:#1E3A30;
      --danger:#E07B72; --warn:#D9A648; --ok:#5FCFA6;
      --st-prospect:#7FA0C0; --st-lead:#4FB3AC; --st-demo:#D9A648; --st-closed:#41BD95; --st-reengage:#A78BCB;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45;
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif; display:flex; flex-direction:column}
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0}
  input,select,textarea{font:inherit; color:var(--ink); background:var(--surface);
    border:1px solid var(--line-strong); border-radius:7px; padding:7px 9px; width:100%}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  ::placeholder{color:var(--muted); opacity:.8}
  [hidden]{display:none !important}

  #gate{flex:1; display:flex; align-items:center; justify-content:center; padding:24px}
  .gate-card{background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); padding:36px 34px; max-width:380px; width:100%; text-align:center}
  .gate-card h1{font-size:20px; font-weight:600; margin:0 0 4px}
  .gate-card .sub{font-size:12px; color:var(--muted); letter-spacing:.05em; text-transform:uppercase; margin-bottom:22px}
  .gate-card p{color:var(--muted); font-size:13px; margin:0 0 16px}
  .gate-card input{text-align:center; font-size:15px; margin-bottom:12px}
  .gate-err{color:var(--danger); font-size:12.5px; margin-top:12px; min-height:1em}
  .gbtn{display:inline-flex; align-items:center; gap:10px; width:100%; justify-content:center;
    padding:10px 16px; border-radius:9px; font-weight:600; font-size:14px; background:var(--accent); color:var(--accent-ink)}
  .gbtn:hover{filter:brightness(1.08)}

  header{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 18px 8px; border-bottom:1px solid var(--line)}
  .brand{display:flex; align-items:baseline; gap:8px}
  .brand h1{font-size:16px; font-weight:600; letter-spacing:-.01em; margin:0}
  .brand .sub{font-size:11px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase}
  .wip{font-size:12px; color:var(--muted); padding:3px 9px; border:1px solid var(--line-strong); border-radius:20px;
    font-variant-numeric:tabular-nums; white-space:nowrap}
  .wip.over{color:var(--danger); border-color:var(--danger); font-weight:600}
  .spacer{margin-left:auto}
  #search{width:190px}
  .btn{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:8px;
    font-weight:600; font-size:13px; background:var(--surface); border:1px solid var(--line-strong)}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .btn.quiet{border-color:transparent; color:var(--muted)}
  .btn.quiet:hover{color:var(--ink)}
  #ownerSel{padding:6px 8px; border-radius:8px; font-size:12.5px; font-weight:600; color:var(--ink);
    background:var(--surface2); border:1px solid var(--line-strong); max-width:170px}
  #ownerSel:hover{border-color:var(--accent)}
  .seg{display:inline-flex; background:var(--surface2); border:1px solid var(--line-strong);
    border-radius:8px; padding:2px; gap:2px}
  .seg button{padding:5px 10px; border-radius:6px; font-size:12.5px; font-weight:600; color:var(--muted);
    display:inline-flex; align-items:center; gap:5px; white-space:nowrap}
  .seg button .n{font-variant-numeric:tabular-nums; opacity:.75; font-weight:500}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
  nav.views{display:flex; gap:2px; padding:0 18px; border-bottom:1px solid var(--line); overflow-x:auto}
  nav.views button{padding:8px 12px; font-size:13px; font-weight:600; color:var(--muted);
    border-bottom:2px solid transparent; white-space:nowrap}
  nav.views button:hover{color:var(--ink)}
  nav.views button[aria-pressed="true"]{color:var(--accent); border-bottom-color:var(--accent)}
  .viewnote{padding:8px 18px 0; font-size:12px; color:var(--muted)}

  main{flex:1; overflow:auto; padding:12px 18px 20px}
  /* ---- table view ---- */
  table{border-collapse:collapse; width:100%; font-size:13px}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
    font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line-strong); position:sticky; top:0; background:var(--bg)}
  td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--surface2)}
  td.num{font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
  .co{font-weight:600}
  .sub2{color:var(--muted); font-size:12px}
  .score{display:inline-block; min-width:30px; text-align:center; font-weight:700; font-variant-numeric:tabular-nums;
    padding:2px 7px; border-radius:6px; background:var(--surface2)}
  .score.hot{background:var(--accent); color:var(--accent-ink)}
  .pill{font-size:11px; font-weight:600; border-radius:20px; padding:2px 8px; white-space:nowrap;
    background:var(--surface2); color:var(--muted); border:1px solid var(--line-strong)}
  .pill.ok{background:var(--accent-soft); color:var(--accent); border-color:transparent}
  .pill.warn{color:var(--warn); border-color:var(--warn)}
  .pill.bad{color:var(--danger); border-color:var(--danger)}
  .stale{color:var(--warn); font-weight:600}
  .empty{color:var(--muted); text-align:center; padding:36px 8px}
  .gapbar{height:10px; background:var(--surface2); border-radius:6px; overflow:hidden; margin:6px 0 2px}
  .gapbar i{display:block; height:100%; background:var(--accent)}
  .kpis{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px}
  .kpi{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 14px; min-width:150px}
  .kpi b{display:block; font-size:20px; font-variant-numeric:tabular-nums}
  .kpi span{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}

  /* ---- board view ---- */
  .board{display:flex; gap:12px; min-width:max-content; height:100%}
  .col{width:250px; flex:0 0 250px; display:flex; flex-direction:column; background:var(--surface2);
    border:1px solid var(--line); border-radius:var(--radius); max-height:100%}
  .col.drag-over{outline:2px dashed var(--accent); outline-offset:-2px}
  .col-head{padding:10px 12px 8px; border-bottom:1px solid var(--line)}
  .col-title{display:flex; align-items:center; gap:8px; font-weight:600; font-size:13px}
  .col-title .dot{width:8px; height:8px; border-radius:50%; flex:none}
  .col-title .count{margin-left:auto; color:var(--muted); font-weight:500}
  .col-cards{flex:1; overflow-y:auto; padding:9px; display:flex; flex-direction:column; gap:8px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:9px 11px;
    box-shadow:var(--shadow); cursor:grab}
  .card:hover{border-color:var(--line-strong)}
  .card.dragging{opacity:.45}
  .card .row{display:flex; align-items:center; gap:7px; margin-top:6px; flex-wrap:wrap}
  .col-add{margin:0 9px 9px; padding:6px; border-radius:8px; font-size:13px; color:var(--muted);
    border:1px dashed var(--line-strong); text-align:center}
  .col-add:hover{color:var(--accent); border-color:var(--accent)}

  /* ---- drawer ---- */
  #overlay{position:fixed; inset:0; background:rgba(15,22,18,.35); opacity:0; pointer-events:none; transition:opacity .18s}
  #overlay.open{opacity:1; pointer-events:auto}
  #drawer{position:fixed; top:0; right:0; bottom:0; width:min(520px,100vw); background:var(--surface);
    border-left:1px solid var(--line); box-shadow:var(--shadow); transform:translateX(102%);
    transition:transform .2s ease; display:flex; flex-direction:column; z-index:5}
  #drawer.open{transform:none}
  @media (prefers-reduced-motion: reduce){ #drawer,#overlay{transition:none} }
  .dw-head{display:flex; align-items:center; gap:10px; padding:14px 18px 8px}
  .dw-head input.co-input{font-size:16px; font-weight:600; border-color:transparent; background:transparent;
    padding:4px 6px; margin-left:-6px}
  .dw-head input.co-input:hover,.dw-head input.co-input:focus{border-color:var(--line-strong); background:var(--surface)}
  .dw-close{color:var(--muted); font-size:20px; line-height:1; padding:4px 8px; border-radius:6px}
  .dw-close:hover{color:var(--ink); background:var(--surface2)}
  .dw-sum{display:flex; gap:8px; flex-wrap:wrap; padding:0 18px 10px; align-items:center}
  .dw-body{flex:1; overflow-y:auto; padding:2px 18px 18px}
  .grp{margin:16px 0 6px; padding-top:12px; border-top:1px solid var(--line); font-size:11px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
  .grp:first-child{border-top:none; margin-top:6px}
  .fgrid{display:grid; grid-template-columns:1fr 1fr; gap:9px}
  .field{display:flex; flex-direction:column; gap:3px}
  .field.wide{grid-column:1 / -1}
  .field label{font-size:10.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted)}
  .field .ro{padding:7px 9px; border:1px dashed var(--line-strong); border-radius:7px; color:var(--muted);
    font-variant-numeric:tabular-nums; background:var(--surface2)}
  .hint{font-size:11px; color:var(--muted); margin-top:2px}
  .composer{display:flex; flex-direction:column; gap:8px; margin-top:6px}
  .composer textarea{resize:vertical; min-height:58px}
  .composer .crow{display:flex; gap:8px}
  .composer select{width:auto; flex:1}
  .log{list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:10px}
  .log li{border-left:2px solid var(--line-strong); padding:2px 0 2px 11px}
  .log li.sys{border-left-color:var(--line)}
  .log .meta{font-size:11.5px; color:var(--muted); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .log .txt{margin-top:2px; white-space:pre-wrap; overflow-wrap:anywhere}
  .log li.sys .txt{color:var(--muted); font-size:12.5px}
  .dw-foot{padding:10px 18px; border-top:1px solid var(--line); display:flex; align-items:center; gap:10px}
  .del{color:var(--danger); font-size:13px; font-weight:600; padding:6px 10px; border-radius:7px}
  .del:hover{background:var(--surface2)}
  /* ---- AI assistant panel ---- */
  #ai{position:fixed; top:0; right:0; bottom:0; width:min(460px,100vw); background:var(--surface);
    border-left:1px solid var(--line); box-shadow:var(--shadow); transform:translateX(102%);
    transition:transform .2s ease; display:flex; flex-direction:column; z-index:6}
  #ai.open{transform:none}
  @media (prefers-reduced-motion: reduce){ #ai{transition:none} }
  .ai-head{display:flex; align-items:center; gap:8px; padding:12px 16px 8px; border-bottom:1px solid var(--line)}
  .ai-head b{font-size:14px}
  .ai-head .sub2{font-size:11.5px}
  .ai-body{flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:12px}
  .msg{font-size:13.5px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere}
  .msg.user{background:var(--surface2); border-radius:10px; padding:9px 12px; align-self:flex-end; max-width:88%}
  .msg.ai{align-self:flex-start; max-width:100%}
  .msg.err{color:var(--danger)}
  .toolchip{font-size:11px; color:var(--muted); border:1px dashed var(--line-strong); border-radius:20px;
    padding:2px 9px; align-self:flex-start; font-variant-numeric:tabular-nums}
  .stage{border:1px solid var(--warn); border-radius:10px; padding:10px 12px; background:var(--surface2)}
  .stage h4{margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--warn)}
  .stage ul{margin:0 0 10px; padding-left:16px; font-size:12.5px}
  .stage li{margin-bottom:3px}
  .stage .row{display:flex; gap:8px}
  .ai-foot{padding:10px 16px 12px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px}
  .ai-foot textarea{resize:vertical; min-height:56px}
  .ai-foot .row{display:flex; gap:8px; align-items:center}
  .ai-foot label{font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:5px}
  .ai-foot label input{width:auto}
  .keygate{padding:16px; font-size:13px; color:var(--muted); line-height:1.55}
  .keygate b{color:var(--ink)}
  .keygate input{margin:10px 0 8px; font-family:ui-monospace,monospace; font-size:12px}
  .spin{display:inline-block; width:11px; height:11px; border:2px solid var(--line-strong);
    border-top-color:var(--accent); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-1px}
  @keyframes sp{to{transform:rotate(360deg)}}

  #toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(60px); background:var(--ink);
    color:var(--bg); padding:9px 16px; border-radius:8px; font-size:13px; font-weight:600; opacity:0;
    transition:all .2s; pointer-events:none; max-width:90vw; z-index:9}
  #toast.show{opacity:1; transform:translateX(-50%)}
  @media (max-width:640px){ header{padding:10px 12px 8px} #search{width:120px} main{padding:10px 12px} }
</style>
</head>
<body>

<div id="gate" hidden>
  <div class="gate-card">
    <h1>Pipeline</h1><div class="sub">NextGen Kitchens</div>
    <p>Sign in with your <b>@nextgenkitchens.com</b> work email.</p>
    <input id="emailIn" type="email" placeholder="you@nextgenkitchens.com" autocomplete="username" spellcheck="false">
    <input id="passIn" type="password" placeholder="Password" autocomplete="current-password">
    <button class="gbtn" id="signinBtn">Sign in</button>
    <div class="gate-err" id="gateErr"></div>
    <div class="sub2" style="margin-top:14px">Access is limited to the NextGen Kitchens team.</div>
  </div>
</div>

<header id="topbar" hidden>
  <div class="brand"><h1>Pipeline</h1><span class="sub">v3</span></div>
  <span class="wip" id="wip"></span>
  <div class="seg" id="statusSeg" role="group" aria-label="Filter by status">
    <button data-status="ACTIVE" aria-pressed="true">Active <span class="n" id="cACT"></span></button>
    <button data-status="PARKED" aria-pressed="false">Parked <span class="n" id="cPRK"></span></button>
    <button data-status="ARCHIVE" aria-pressed="false">Archive <span class="n" id="cARC"></span></button>
    <button data-status="" aria-pressed="false">All <span class="n" id="cALL"></span></button>
  </div>
  <div class="seg" id="regionSeg" role="group" aria-label="Filter by region">
    <button data-region="" aria-pressed="true">All</button>
    <button data-region="Canada" aria-pressed="false">🇨🇦</button>
    <button data-region="United States" aria-pressed="false">🇺🇸</button>
  </div>
  <select id="ownerSel" aria-label="Filter by owner" title="Show only one person's deals">
    <option value="">All owners</option>
  </select>
  <span class="spacer"></span>
  <input id="search" type="search" placeholder="Search…" aria-label="Search deals">
  <button class="btn" id="aiBtn" title="Ask about the pipeline or make changes in plain English">Ask AI</button>
  <button class="btn primary" id="addBtn">+ Deal</button>
  <button class="btn quiet" id="exportBtn" title="Download a JSON backup">Export</button>
  <button class="btn quiet" id="whoBtn" title="Change your name"></button>
</header>

<nav class="views" id="viewNav" hidden></nav>
<div class="viewnote" id="viewNote" hidden></div>
<main id="mainWrap" hidden></main>

<div id="overlay"></div>
<aside id="drawer" aria-label="Deal details"></aside>
<aside id="ai" aria-label="AI assistant">
  <div class="ai-head">
    <div><b>Ask AI</b><div class="sub2">Claude Sonnet · reads and edits this pipeline</div></div>
    <span class="spacer"></span>
    <button class="btn quiet" id="aiClear" title="Start a new conversation">Clear</button>
    <button class="dw-close" id="aiClose" aria-label="Close">&times;</button>
  </div>
  <div class="ai-body" id="aiBody"></div>
  <div class="ai-foot" id="aiFoot" hidden>
    <textarea id="aiInput" placeholder="e.g. Which Canadian deals go stale first? · Set the next step on Red Lotus Den to “call Henry Lee Friday”"></textarea>
    <div class="row">
      <label><input type="checkbox" id="aiAuto"> Apply changes without asking</label>
      <span class="spacer"></span>
      <button class="btn primary" id="aiSend">Send</button>
    </div>
  </div>
</aside>
<div id="toast" role="status"></div>

<script type="module">
/* NextGen Prospect CRM v3.0
   Sort key is Buyable (budget + decider + deadline), not Tier.
   Computed fields are derived here from raw fields so they can never drift. */
const CONFIG = {
  SUPABASE_URL:      'https://ywrtfztkbavlqtqwuyoa.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_2eXzcJqB2jdBHK7egojfDg_T2MWpJ4y',
};
const AUTH_DOMAIN = 'nextgenkitchens.com';   // only email addresses on this domain may sign in
const GAP_TARGET = 800000;
const WIP_CAP    = 20;   // R5
const STALE_DAYS = 21;   // R6
/* Revenue model is not yet defined. While null, all revenue-derived fields read
   "unknown" and the Account_Band component of Priority_Score is 0 for every row
   (neutral — it cannot distort ranking). Set both numbers to switch it on. */
const REVENUE_MODEL = null;   // { perVendorYear1: 0, implementationFee: 0 }

const STAGES = [
  {id:'prospect', name:'Prospects', color:'var(--st-prospect)'},
  {id:'lead',     name:'Leads',     color:'var(--st-lead)'},
  {id:'demo',     name:'Demo',      color:'var(--st-demo)'},
  {id:'closed',   name:'Closed',    color:'var(--st-closed)'},
  {id:'reengage', name:'Re-engage', color:'var(--st-reengage)'},
];
const METHODS = ['Email','LinkedIn','Cold call','Referral','Event','Inbound','Other'];
const YNU = ['unknown','Y','N'];

/* field metadata drives the drawer; key = db column */
const F = [
 ['A · Identity', [
  ['venue_type','Venue type','sel',['food hall','food court','mixed-use','airport','stadium','other']],
  ['city','City','txt'], ['state_prov','State / Prov','txt'], ['country','Country','sel',['','Canada','United States']],
  ['coverage','Coverage (in-person)','sel',['','Y','N']],
  ['buyer_entity','Buyer entity','sel',['unknown','landlord','developer','operator','institutional owner']],
  ['parent_portfolio','Parent portfolio','txt','wide'],
 ]],
 ['B · Money is already allocated', [
  ['capital_status','Capital status','sel',['','under construction','pre-opening','recently opened (<6mo)','open-operating']],
  ['opening_date','Opening date','date'],
  ['budget_allocated','Budget allocated','sel',['unknown','confirmed','likely','none']],
  ['budget_type','Budget type','sel',['unknown','capital line item','opex','none']],
  ['tech_line_item','Tech line item','sel',YNU],
  ['trigger_event','Trigger event','sel',['none','construction start','tech RFP','GM hire','renovation','lease-up']],
  ['trigger_date','Trigger date','date'],
 ]],
 ['C · Who signs', [
  ['contact','Decision maker','txt'], ['dm_title','Title','txt'],
  ['signs_contract','Signs contract?','sel',YNU],
  ['email','Email','txt'], ['email_verified','Email verified','sel',['N','Y']],
  ['champion_name','Champion','txt'], ['champion_title','Champion title','txt'],
  ['committee_known','Buying committee known','sel',['N','Y']],
  ['cash_at_signature','Cash at signature ($)','num'],
  ['contract_model_fit','Contract model fit','sel',['unknown','free transaction','paid implementation','both']],
 ]],
 ['D · Incumbent', [
  ['current_stack','Current stack','sel',['unknown','none','GoTab','Tabski','Toast','Square','Otter','Empower Delivery','proprietary/in-house']],
  ['competitive_posture','Posture','sel',['unknown','greenfield','rip-and-replace','hybrid/overlay']],
  ['incumbent_contract_end','Incumbent contract end','date'],
  ['switching_cost','Switching cost','sel',['unknown','low','med','high']],
 ]],
 ['E · Cost of inaction', [
  ['pain_if_nothing','Pain if nothing changes (specific — blank disqualifies)','area','wide'],
  ['forcing_function','Forcing function','sel',['none','opening date','lease deadline','reporting mandate','event']],
 ]],
 ['F · Size', [
  ['vendor_count','Vendor count','num'], ['est_annual_gmv','Est annual GMV ($)','num'],
  ['est_year1_revenue','Est year-1 revenue NGK ($)','num'],
 ]],
 ['G · Relationship', [
  ['warm_path','Warm path','sel',['N','Y']], ['intro_source','Intro source','txt'],
  ['relationship_strength','Strength','sel',['cold','2nd-degree','known','referred']],
 ]],
 ['H · Learning loop', [
  ['owner','Owner','ownerlist'],

  ['touch_count','Touch count','num'], ['channel_history','Channel history','txt'],

  ['next_step','Next step (specific action)','txt','wide'],
  ['next_date','Next step date','date'],
  ['recheck_date','Re-check date (parked)','date'],
  ['status_override','Status override','sel',['','ACTIVE','PARKED','ARCHIVE']],
 ]],
];

const VIEWS = [
  ['table','Priority',  'R1: Priority_Score desc, then soonest forcing function.'],
  ['board','Board',     'Kanban by stage. Same filters apply.'],
  ['v1','This Week',    'V1: ACTIVE rows with a Next_Step_Date within 7 days.'],
  ['v2','Warm Paths',   'V2: Warm_Path = Y, any status.'],
  ['v3','Triggers',     'V3: sorted by opening date, next 180 days.'],
  ['v4','Greenfield',   'V4: Competitive_Posture = greenfield AND Qualified.'],
  ['v5','Gap Math',     'V5: cumulative Est_Year1_Revenue vs the $800K gap.'],
  ['v6','Graveyard',    'V6: archived / lost rows with Reason_Quiet — review monthly.'],
];

const $ = id => document.getElementById(id);
const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
const sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

let state = {deals: []};
let openId = null, query = '', region = '', statusF = 'ACTIVE', view = 'table', owner = '', booted = false;
let authUser = null;                  // the signed-in user; null until authenticated

/* ---------------- helpers ---------------- */
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date(new Date().toISOString().slice(0,10));
const dayDiff = (a,b) => Math.round((a-b)/86400000);
const parseD = s => s ? new Date(s+'T00:00:00') : null;
const fmtMoney = n => (n==null||n==='') ? '' : '$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:0});
const fmtDate = s => { const d=parseD(s); return d? d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):''; };
const fmtDT = ts => new Date(ts).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const who = () => (authUser?.email || '').split('@')[0] || '';
const uid = () => 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const flagOf = d => d.country==='Canada' ? '🇨🇦' : d.country==='United States' ? '🇺🇸' : '';

/* ---------------- computed fields (section I) ---------------- */
function forcingDate(d){
  const cands = [];
  if(d.forcing_function==='opening date' && d.opening_date) cands.push(d.opening_date);
  if(d.forcing_function==='reporting mandate' && d.trigger_date) cands.push(d.trigger_date);
  if(d.forcing_function==='lease deadline' && d.trigger_date) cands.push(d.trigger_date);
  if(!cands.length && d.opening_date && d.forcing_function!=='none') cands.push(d.opening_date);
  const fut = cands.map(parseD).filter(x=>x && x>=today()).sort((a,b)=>a-b);
  return fut[0] || null;
}
function compute(d){
  const fd = forcingDate(d);
  d._urgency = fd ? dayDiff(fd, today()) : null;
  d._forcingDate = fd;
  const lt = parseD(d.last_touch_date);
  d._daysSince = lt ? dayDiff(today(), lt) : null;
  d._stale = (d._daysSince!=null && d._daysSince >= STALE_DAYS) ||
             (d.touch_count>0 && !d.last_touch_date);
  // revenue-derived
  if(REVENUE_MODEL && d.vendor_count){
    d._rev = d.est_year1_revenue ?? (d.vendor_count*REVENUE_MODEL.perVendorYear1 + REVENUE_MODEL.implementationFee);
  } else d._rev = d.est_year1_revenue ?? null;
  d._band = d._rev==null ? 'unknown'
          : d._rev < 25000 ? '<$25K' : d._rev < 75000 ? '$25-75K' : d._rev < 150000 ? '$75-150K' : '$150K+';
  d._pctGap = d._rev==null ? null : d._rev/GAP_TARGET;
  // Qualified (spec 50)
  d._qualified = d.budget_allocated!=='none' && d.signs_contract!=='unknown'
              && d.forcing_function!=='none' && !!(d.pain_if_nothing||'').trim();
  // Priority_Score (spec 51)
  let s = 0, u = d._urgency;
  if(u!=null && u>=0) s += u<=30?30 : u<=60?25 : u<=90?20 : u<=180?15 : u<=365?8 : 3;
  s += ({confirmed:25, likely:15, unknown:5, none:0})[d.budget_allocated] ?? 5;
  if(d.signs_contract==='Y' && d.email_verified==='Y') s += 20;
  else if(d.signs_contract==='Y') s += 15;
  else if(d.champion_name || d.contact) s += 8;
  else if(d.dm_title) s += 3;
  s += ({'$150K+':15,'$75-150K':11,'$25-75K':6,'<$25K':2,'unknown':0})[d._band];
  s += d.warm_path==='Y' ? 10 : 0;
  d._score = s;
}
/* Status needs the whole set (R5 cap is global), so it is a second pass. */
function computeAll(){
  state.deals.forEach(compute);
  const cand = [];
  for(const d of state.deals){
    let st;
    if(d.status_override) st = d.status_override;                                   // human wins
    else if(d.capital_status==='open-operating' && d.forcing_function==='none') st='ARCHIVE';   // R3
    else if(d.coverage==='N' && d.warm_path==='N' && ['<$25K','$25-75K'].includes(d._band)) st='ARCHIVE'; // R8
    else if(!d._qualified) st='PARKED';                                             // R2
    else st='ACTIVE';
    d._status = st;
    if(st==='ACTIVE' && !d.status_override) cand.push(d);
  }
  cand.sort((a,b)=> b._score-a._score || (a._urgency??9999)-(b._urgency??9999));
  cand.slice(WIP_CAP).forEach(d=>{ d._status='PARKED'; d._cappedOut=true; });        // R5
}

/* ---------------- data ---------------- */
function rowToDeal(row, acts){
  const d = {...row};
  d.log = (acts||[]).map(a=>({ts:new Date(a.ts).getTime(), type:a.type, text:a.text, method:a.method||'', author:a.author||''}));
  d.created = new Date(row.created_at).getTime();
  return d;
}
async function loadAll(){
  const [dRes,aRes] = await Promise.all([
    sb.from('deals').select('*').order('created_at',{ascending:false}),
    sb.from('activity').select('*').order('ts',{ascending:true}),
  ]);
  if(dRes.error || aRes.error){ toast('Load failed — '+(dRes.error||aRes.error).message); return; }
  const by = {};
  for(const a of aRes.data) (by[a.deal_id] = by[a.deal_id]||[]).push(a);
  state.deals = dRes.data.map(r=>rowToDeal(r, by[r.id]));
  computeAll(); render();
  if(openId && !drawer.contains(document.activeElement)) renderDrawer();
}
let rt; const queueReload = ()=>{ clearTimeout(rt); rt=setTimeout(loadAll,400); };
function subscribe(){
  sb.channel('crm-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'deals'},queueReload)
    .on('postgres_changes',{event:'*',schema:'public',table:'activity'},queueReload)
    .subscribe();
}
async function dbUpdate(id, patch){
  const {error} = await sb.from('deals').update(patch).eq('id',id);
  if(error) toast('Save failed — '+error.message);
}
async function dbLog(dealId, e){
  const {error} = await sb.from('activity').insert({deal_id:dealId, type:e.type, text:e.text,
    method:e.method||'', author:e.author||who(), ...(e.ts?{ts:new Date(e.ts).toISOString()}:{})});
  if(error) toast('Save failed — '+error.message);
}

/* ---------------- filtering ---------------- */
function textMatch(d){
  if(!query) return true;
  const q = query.toLowerCase();
  return [d.company,d.contact,d.dm_title,d.champion_name,d.email,d.city,d.state_prov,d.country,
          d.parent_portfolio,d.current_stack,d.pain_if_nothing,d.next_step,d.owner,d.disposition,
          ...(d.log||[]).map(e=>e.text+' '+e.author)].join(' ').toLowerCase().includes(q);
}
const inRegion = d => !region || d.country===region;
/* Deliberately exact, not a text search: textMatch() also scans note authors, so
   searching a name returns deals that person merely commented on. */
const isOwner  = d => !owner || (d.owner||'').trim().toLowerCase() === owner.toLowerCase();
function baseSet(){ return state.deals.filter(d=>textMatch(d) && inRegion(d) && isOwner(d)); }
function visible(){
  return baseSet().filter(d=> !statusF || d._status===statusF);
}
const byPriority = (a,b)=> b._score-a._score || (a._urgency??9999)-(b._urgency??9999);

/* ---------------- render ---------------- */
const mainWrap = $('mainWrap');
function render(){
  const keepMainTop = mainWrap.scrollTop;
  const pool = baseSet();
  $('cACT').textContent = pool.filter(d=>d._status==='ACTIVE').length;
  $('cPRK').textContent = pool.filter(d=>d._status==='PARKED').length;
  $('cARC').textContent = pool.filter(d=>d._status==='ARCHIVE').length;
  $('cALL').textContent = pool.length;
  const act = state.deals.filter(d=>d._status==='ACTIVE').length;
  const untouched = state.deals.filter(d=>d._status==='ACTIVE' && d.disposition==='untouched').length;
  const w = $('wip');
  w.textContent = `ACTIVE ${act}/${WIP_CAP} · untouched ${untouched}`;
  w.className = 'wip' + (act>WIP_CAP ? ' over' : '');
  w.title = untouched>=WIP_CAP ? 'R4: list is frozen — work the untouched rows before adding more.'
                               : 'R5 work-in-progress cap. R4 unfreezes new rows below 20 untouched.';
  const v = VIEWS.find(x=>x[0]===view);
  $('viewNote').textContent = v ? v[2] : '';
  ({table:vTable, board:vBoard, v1:v1, v2:v2, v3:v3, v4:v4, v5:v5, v6:v6})[view]();
  mainWrap.scrollTop = keepMainTop;   // the renderer replaced <main>'s contents; put the reader back
  syncFilterUI();
}
function cols(rows, extra){
  if(!rows.length) return `<div class="empty">No rows match.</div>`;
  return `<table><thead><tr>
    <th>Score</th><th>Account</th><th>Status</th><th>Capital / trigger</th><th>Signer</th>
    <th class="num">Urgency</th><th>Next step</th><th>Owner</th>${extra?`<th>${extra.h}</th>`:''}
  </tr></thead><tbody>${rows.map(d=>`
    <tr data-id="${d.id}">
      <td><span class="score${d._score>=50?' hot':''}">${d._score}</span></td>
      <td><div class="co">${esc(d.company)||'Untitled'}</div>
          <div class="sub2">${flagOf(d)} ${esc([d.city,d.state_prov].filter(Boolean).join(', '))}${d.parent_portfolio?' · '+esc(d.parent_portfolio):''}</div></td>
      <td><span class="pill ${d._status==='ACTIVE'?'ok':d._status==='ARCHIVE'?'bad':''}">${d._status}</span>
          ${d._qualified?'':'<div class="sub2">unqualified</div>'}</td>
      <td>${esc(d.capital_status||'—')}<div class="sub2">${esc(d.trigger_event||'')}${d.budget_allocated!=='unknown'?' · budget '+esc(d.budget_allocated):''}</div></td>
      <td>${esc(d.contact||'—')}<div class="sub2">${d.signs_contract==='Y'?'signer':d.signs_contract==='N'?'champion':'signer unknown'}</div></td>
      <td class="num">${d._urgency==null?'—':d._urgency+'d'}<div class="sub2">${d._forcingDate?fmtDate(d._forcingDate.toISOString().slice(0,10)):''}</div></td>
      <td>${esc(d.next_step||'')||'<span class="sub2">—</span>'}<div class="sub2">${fmtDate(d.next_date)}</div></td>
      <td>${esc(d.owner||'')}<div class="sub2 ${d._stale?'stale':''}">${d._daysSince!=null?d._daysSince+'d since touch':(d.touch_count>0?'touched, date unknown':'untouched')}</div></td>
      ${extra?`<td>${extra.cell(d)}</td>`:''}
    </tr>`).join('')}</tbody></table>`;
}
function vTable(){ mainWrap.innerHTML = cols(visible().sort(byPriority)); }
function v1(){
  const lim = new Date(today()); lim.setDate(lim.getDate()+7);
  const rows = baseSet().filter(d=>d._status==='ACTIVE' && d.next_date && parseD(d.next_date)<=lim).sort(byPriority);
  mainWrap.innerHTML = cols(rows);
}
function v2(){ mainWrap.innerHTML = cols(baseSet().filter(d=>d.warm_path==='Y').sort(byPriority),
  {h:'Intro source', cell:d=>esc(d.intro_source||d.relationship_strength||'')}); }
function v3(){
  const lim = new Date(today()); lim.setDate(lim.getDate()+180);
  const rows = baseSet().filter(d=>d._forcingDate && d._forcingDate<=lim)
    .sort((a,b)=>a._forcingDate-b._forcingDate);
  mainWrap.innerHTML = cols(rows);
}
function v4(){ mainWrap.innerHTML = cols(baseSet().filter(d=>d.competitive_posture==='greenfield' && d._qualified).sort(byPriority)); }
function v5(){
  const rows = baseSet().filter(d=>['$75-150K','$150K+'].includes(d._band)).sort(byPriority);
  const known = baseSet().filter(d=>d._rev!=null);
  const total = known.reduce((s,d)=>s+d._rev,0);
  const activeTotal = baseSet().filter(d=>d._status==='ACTIVE' && d._rev!=null).reduce((s,d)=>s+d._rev,0);
  let cum = 0;
  const body = rows.length ? cols(rows,{h:'Cumulative', cell:d=>{cum+=d._rev||0; return fmtMoney(cum);}}) :
    `<div class="empty">No rows have an Est_Year1_Revenue yet — set the revenue model in the app config
       (or fill the field per row) and this view fills in automatically.</div>`;
  mainWrap.innerHTML = `
    <div class="kpis">
      <div class="kpi"><b>${fmtMoney(activeTotal)||'—'}</b><span>ACTIVE pipeline (year 1)</span></div>
      <div class="kpi"><b>${fmtMoney(GAP_TARGET)}</b><span>Gap target</span></div>
      <div class="kpi"><b>${fmtMoney(Math.max(0,GAP_TARGET-activeTotal))}</b><span>Still to find</span></div>
      <div class="kpi"><b>${known.length}/${baseSet().length}</b><span>Rows with a revenue estimate</span></div>
    </div>
    <div class="gapbar"><i style="width:${Math.min(100,activeTotal/GAP_TARGET*100)}%"></i></div>
    <div class="sub2" style="margin-bottom:14px">Coverage of the $800K gap from ACTIVE rows.</div>${body}`;
}
function v6(){
  const rows = baseSet().filter(d=>d._status==='ARCHIVE' || (d.disposition||'').startsWith('lost'))
    .sort((a,b)=>(a.company||'').localeCompare(b.company||''));
  mainWrap.innerHTML = cols(rows, {h:'Reason quiet', cell:d=>esc(d.reason_quiet||'<missing>')});
}
function vBoard(){
  const set = visible();
  mainWrap.innerHTML = `<div class="board">${STAGES.map(st=>{
    const ds = set.filter(d=>d.stage===st.id).sort(byPriority);
    return `<section class="col" data-stage="${st.id}">

        <article class="card" draggable="true" data-id="${d.id}" tabindex="0">

/* delegated interactions */
mainWrap.addEventListener('click', e=>{
  const add = e.target.closest('.col-add'); if(add) return addDeal(add.dataset.stage);
  const row = e.target.closest('tr[data-id], .card[data-id]');
  if(row) openDrawer(row.dataset.id);
});
mainWrap.addEventListener('dragstart', e=>{
  const c = e.target.closest('.card'); if(!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.id); c.classList.add('dragging');
});
mainWrap.addEventListener('dragend', e=>{ const c=e.target.closest('.card'); if(c) c.classList.remove('dragging'); });
mainWrap.addEventListener('dragover', e=>{ const col=e.target.closest('.col'); if(!col) return;
  e.preventDefault(); col.classList.add('drag-over'); });
mainWrap.addEventListener('dragleave', e=>{ const col=e.target.closest('.col');
  if(col && !col.contains(e.relatedTarget)) col.classList.remove('drag-over'); });
mainWrap.addEventListener('drop', e=>{ const col=e.target.closest('.col'); if(!col) return;
  e.preventDefault(); col.classList.remove('drag-over');
  moveStage(e.dataTransfer.getData('text/plain'), col.dataset.stage); });

async function moveStage(id, stage){
  const d = state.deals.find(x=>x.id===id);
  if(!d || d.stage===stage) return;
  const from = d.stage; d.stage = stage;
  const entry = {ts:Date.now(), type:'stage', text:`Moved ${from} → ${stage}`, author:who()};
  d.log.push(entry); computeAll(); render();
  await dbUpdate(id,{stage}); await dbLog(id, entry);
}
async function addDeal(stage){
  stage = stage||'prospect';
  const d = {id:uid(), stage, company:'', contact:'', email:'', country:region, city:'', state_prov:'',
    budget_allocated:'unknown', signs_contract:'unknown', forcing_function:'none', pain_if_nothing:'',
    disposition:'untouched', owner:who()||'Ash', warm_path:'N', email_verified:'N', touch_count:0,
    coverage:'', capital_status:'', trigger_event:'none', current_stack:'unknown',
    competitive_posture:'unknown', relationship_strength:'cold', created:Date.now(), created_at:new Date().toISOString(),
    log:[{ts:Date.now(), type:'sys', text:'Deal created', author:who()}]};
  state.deals.unshift(d); computeAll(); render(); openDrawer(d.id, true);
  const {error} = await sb.from('deals').insert({id:d.id, stage, country:d.country, owner:d.owner});
  if(error){ toast('Create failed — '+error.message); return; }
  await dbLog(d.id, d.log[0]);
}

overlay.addEventListener('click', closeDrawer);

function fieldHTML(d, [key,label,type,arg,wide]){
  const w = (arg==='wide'||wide==='wide') ? ' wide' : '';
  const v = d[key];
  if(type==='sel'){
    const opts = Array.isArray(arg)?arg:[];
    return `<div class="field${w}"><label>${label}</label><select data-f="${key}">${
      opts.map(o=>`<option value="${esc(o)}"${(v||'')===o?' selected':''}>${esc(o||'—')}</option>`).join('')}</select></div>`;
  }
  if(type==='ownerlist'){
    const names = [...new Set(['Ash','Clayton','Portland rep',
      ...state.deals.map(x=>(x.owner||'').trim()).filter(Boolean)])].sort();
    return `<div class="field${w}"><label>${label}</label>
      <input data-f="${key}" list="ownerDL" value="${esc(v??'')}" placeholder="Type any name">

  if(type==='area') return `<div class="field${w}"><label>${label}</label><textarea data-f="${key}" rows="2">${esc(v||'')}</textarea></div>`;

}

      </div>
      <div class="grp">Notes &amp; activity</div>
      <div class="composer">
        <textarea id="noteText" placeholder="What happened — context, objections, what was said…"></textarea>
        <div class="crow">
          <select id="noteMethod"><option value="">Just a note</option>${
            METHODS.map(m=>`<option>Touched via ${m}</option>`).join('')}</select>
          <button class="btn primary" id="noteAdd">Add</button>
        </div>
      </div>
      <ul class="log">${[...(d.log||[])].sort((a,b)=>b.ts-a.ts).map(e=>`
        <li class="${e.type==='note'?'':'sys'}">
          <div class="meta">${fmtDT(e.ts)}${e.author?' · '+esc(e.author):''}${e.method?` <span class="pill">${esc(e.method)}</span>`:''}</div>

  drawer.querySelector('.dw-close').addEventListener('click', closeDrawer);
  drawer.querySelectorAll('[data-f]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const f = inp.dataset.f;
      if(f==='stage') return moveStage(d.id, inp.value);
      let val = inp.value;
      if(inp.type==='number') val = val===''? null : Number(val);
      d[f] = val; computeAll(); render(); renderDrawer();
      dbUpdate(d.id, {[f]: val});
    });
  });
  const nt = drawer.querySelector('#noteText'), nm = drawer.querySelector('#noteMethod');
  const addNote = async ()=>{
    const text = nt.value.trim(), mv = nm.value;
    const method = mv ? mv.replace('Touched via ','') : '';
    if(!text && !method) return;
    const iso = new Date().toISOString().slice(0,10);
    const entry = {ts:Date.now(), type:'note', text: text||('Reached out via '+method), method, author:who()};
    d.log.push(entry);
    const patch = {last_touch_date: iso, touch_count: (d.touch_count||0)+1};
    if(!d.first_touch_date) patch.first_touch_date = iso;
    if(method){ patch.method = method;
      patch.channel_history = d.channel_history ? d.channel_history+' > '+method : method; }
    if(d.disposition==='untouched') patch.disposition = 'contacted-no-reply';
    Object.assign(d, patch);
    computeAll(); render(); renderDrawer(); drawer.querySelector('#noteText').focus();
    await dbLog(d.id, entry); await dbUpdate(d.id, patch);
  };
  drawer.querySelector('#noteAdd').addEventListener('click', addNote);
  nt.addEventListener('keydown', e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)) addNote(); });
  drawer.querySelector('#delBtn').addEventListener('click', async ()=>{
    if(!confirm(`Delete "${d.company||'this deal'}" and its notes for the whole team? This can't be undone.`)) return;
    state.deals = state.deals.filter(x=>x.id!==d.id); computeAll(); render(); closeDrawer();
    const {error} = await sb.from('deals').delete().eq('id', d.id);
    toast(error?'Delete failed — '+error.message:'Deal deleted');
  });
  if(keepField){
    const back = drawer.querySelector(`[data-f="${keepField}"]`) || drawer.querySelector('#'+keepField);
    if(back){
      back.focus({preventScroll:true});   // plain focus() scrolls the field into view and undoes the restore below
      if(keepSel && back.setSelectionRange){ try{ back.setSelectionRange(keepSel[0], keepSel[1]); }catch(e){} }
    }
  }
  const nb = drawer.querySelector('.dw-body');
  if(nb) nb.scrollTop = keepTop;
  if(focus) drawer.querySelector('.co-input').focus();
}

let aiMsgs = [];             // Anthropic message history — {role, content} ONLY
let aiLog  = [];             // what the panel shows — {kind, text}
let aiStaged = [];           // {label, apply()} pending approval
let aiBusy = false;

   description:'Search the pipeline and return matching deals with their key fields. Use this to answer any question about deals. Omit all filters to get the whole pipeline.',
   input_schema:{type:'object', properties:{
     text:{type:'string', description:'Free text matched against company, contact, city, notes, pain, next step.'},
     status:{type:'string', enum:['ACTIVE','PARKED','ARCHIVE'], description:'Computed status.'},
     country:{type:'string', enum:['Canada','United States']},
     stage:{type:'string', enum:['prospect','lead','demo','closed','reengage']},
     disposition:{type:'string'},
     owner:{type:'string', description:'Exact deal owner. Use this for "whose deals" questions — do not put a person name in `text`, which also matches note authors.'},
     qualified:{type:'boolean'},
     stale:{type:'boolean', description:'Only rows with no touch in 21+ days, or touched with no recorded date.'},
     min_score:{type:'integer'}, limit:{type:'integer', description:'Default 25, max 90.'}}}},
  {name:'get_deal',
   description:'Return one deal in full, including every field and its complete notes/activity log.',
   input_schema:{type:'object', properties:{id:{type:'string'}, company:{type:'string'}}}},
  {name:'update_deal',

function aiFindDeal(a){
  if(a.id){ const d = state.deals.find(x=>x.id===a.id); if(d) return d; }
  if(a.company){
    const q = a.company.toLowerCase();
    return state.deals.find(x=>(x.company||'').toLowerCase()===q)
        || state.deals.find(x=>(x.company||'').toLowerCase().includes(q));
  }
  return null;
}
const aiSlim = d => ({
  id:d.id, company:d.company, status:d._status, priority_score:d._score, qualified:d._qualified,
  stage:d.stage, disposition:d.disposition, owner:d.owner,
  city:d.city, state_prov:d.state_prov, country:d.country, coverage:d.coverage,
  venue_type:d.venue_type, buyer_entity:d.buyer_entity, parent_portfolio:d.parent_portfolio,
  capital_status:d.capital_status, opening_date:d.opening_date, budget_allocated:d.budget_allocated,
  trigger_event:d.trigger_event, forcing_function:d.forcing_function, urgency_window_days:d._urgency,
  decision_maker:d.contact, dm_title:d.dm_title, signs_contract:d.signs_contract, email:d.email,
  champion:d.champion_name, current_stack:d.current_stack, competitive_posture:d.competitive_posture,
  pain_if_nothing:d.pain_if_nothing, vendor_count:d.vendor_count,
  warm_path:d.warm_path, relationship_strength:d.relationship_strength,

async function aiRunTool(name, a){
  /* View changes apply immediately and are never staged: they are reversible,
     visible, and putting an approval click in front of "show me X" would make
     the assistant slower than the toolbar it is replacing. */
  if(name==='set_view'){
    const changed = [];
    if(a.view!=null && VIEWS.some(v=>v[0]===a.view)){ view = a.view; changed.push('view '+(VIEWS.find(v=>v[0]===a.view)[1])); }
    if(a.owner!=null){
      if(a.owner===''){ owner=''; changed.push('all owners'); }
      else {
        const names = [...new Set(state.deals.map(d=>(d.owner||'').trim()).filter(Boolean))];
        const hit = names.find(n=>n.toLowerCase()===a.owner.trim().toLowerCase())
                 || names.find(n=>n.toLowerCase().includes(a.owner.trim().toLowerCase()));
        if(!hit) return {error:`No deals are owned by "${a.owner}". Owners on file: ${names.sort().join(', ')||'none'}.`};
        owner = hit; changed.push('owner '+hit);
      }
    }
    if(a.status!=null){ statusF = a.status; changed.push('status '+(a.status||'all')); }
    if(a.country!=null){ region = a.country; changed.push(a.country||'all regions'); }
    if(a.search!=null){ query = a.search; changed.push(a.search? 'search "'+a.search+'"' : 'search cleared'); }
    render();
    if(changed.length) toast('AI: '+changed.join(' · '));
    return {applied: changed, now_showing: visible().length, of_total: state.deals.length,
            note:'The board on screen now shows exactly these rows. Tell the user what is on screen; do not re-list every row unless asked.'};
  }
  if(name==='open_deal'){
    const d = aiFindDeal(a);
    if(!d) return {error:'No deal matched.'};
    openDrawer(d.id);
    return {opened: d.company, id: d.id, note:'The drawer is open on screen.'};
  }
  if(name==='search_deals'){
    let rows = state.deals.slice();
    if(a.status) rows = rows.filter(d=>d._status===a.status);
    if(a.country) rows = rows.filter(d=>d.country===a.country);
    if(a.stage) rows = rows.filter(d=>d.stage===a.stage);
    if(a.disposition) rows = rows.filter(d=>d.disposition===a.disposition);
    if(a.owner){ const o=a.owner.trim().toLowerCase();
      rows = rows.filter(d=>(d.owner||'').trim().toLowerCase()===o); }
    if(a.qualified!=null) rows = rows.filter(d=>d._qualified===a.qualified);
    if(a.stale) rows = rows.filter(d=>d._stale);
    if(a.min_score!=null) rows = rows.filter(d=>d._score>=a.min_score);
    if(a.text){ const q=a.text.toLowerCase();
      rows = rows.filter(d=>[d.company,d.contact,d.city,d.state_prov,d.parent_portfolio,d.pain_if_nothing,
        d.next_step,d.current_stack,...(d.log||[]).map(e=>e.text)].join(' ').toLowerCase().includes(q)); }
    rows.sort(byPriority);
    const lim = Math.min(a.limit||25, 90);
    return {matched: rows.length, returned: Math.min(rows.length,lim), deals: rows.slice(0,lim).map(aiSlim)};
  }
  if(name==='get_deal'){
    const d = aiFindDeal(a);
    if(!d) return {error:'No deal matched. Use search_deals to find the exact company name.'};
    return {...aiSlim(d), tier_legacy:d.tier_legacy, source_url:d.source_url, intro_source:d.intro_source,
      channel_history:d.channel_history, recheck_date:d.recheck_date,
      notes:(d.log||[]).slice().sort((x,y)=>x.ts-y.ts).map(e=>({when:new Date(e.ts).toISOString().slice(0,10), who:e.author, text:e.text}))};
  }
  if(name==='update_deal'){
    const d = aiFindDeal(a);
    if(!d) return {error:'No deal matched.'};
    const cols = new Set(['company','contact','email','phone','role','method','value',
      'stage','disposition','owner','reason_quiet','next_step',
      'next_date','recheck_date','status_override','intro_source','channel_history','first_touch_date',
      'last_touch_date','touch_count','champion_name','champion_title','committee_known','dm_title',
      'signs_contract','email_verified','warm_path','relationship_strength','venue_type','buyer_entity',
      'parent_portfolio','capital_status','opening_date','budget_allocated','budget_type','tech_line_item',
      'trigger_event','trigger_date','current_stack','competitive_posture','switching_cost',
      'incumbent_contract_end','pain_if_nothing','forcing_function','vendor_count','est_annual_gmv',
      'est_year1_revenue','cash_at_signature','contract_model_fit','coverage','city','state_prov','country']);
    const patch = {}, bad = [];
    for(const [k,v] of Object.entries(a.fields||{})) cols.has(k) ? patch[k]=v : bad.push(k);
    if(!Object.keys(patch).length) return {error:'No valid fields. Unknown: '+bad.join(', ')};
    const before = Object.fromEntries(Object.keys(patch).map(k=>[k, d[k]]));
    const label = `${d.company}: ` + Object.entries(patch)
      .map(([k,v])=>`${k} ${JSON.stringify(before[k]??'')} → ${JSON.stringify(v)}`).join('; ');
    const apply = async ()=>{ Object.assign(d, patch); computeAll(); render();
      await dbUpdate(d.id, patch);
      await dbLog(d.id, {ts:Date.now(), type:'sys', text:`AI update — ${a.reason}\n${label}`, author:'AI · '+who()}); };
    if($('aiAuto').checked){ await apply(); return {applied:true, change:label}; }
    aiStaged.push({label, apply});
    return {staged:true, awaiting_user_approval:true, change:label,
      note:'Not applied yet. Tell the user what you propose; they will approve it.'};
  }
  if(name==='add_note'){
    const d = aiFindDeal(a);
    if(!d) return {error:'No deal matched.'};
    const iso = new Date().toISOString().slice(0,10);
    const label = `${d.company}: note — “${a.text.slice(0,90)}${a.text.length>90?'…':''}”`;
    const apply = async ()=>{
      const entry = {ts:Date.now(), type:'note', text:a.text, method:a.method||'', author:'AI · '+who()};
      d.log.push(entry);
      const patch = {last_touch_date:iso, touch_count:(d.touch_count||0)+1};
      if(!d.first_touch_date) patch.first_touch_date = iso;
      if(a.method) patch.method = a.method;
      if(d.disposition==='untouched') patch.disposition = 'contacted-no-reply';
      Object.assign(d, patch); computeAll(); render();
      await dbLog(d.id, entry); await dbUpdate(d.id, patch); };
    if($('aiAuto').checked){ await apply(); return {applied:true, note:label}; }
    aiStaged.push({label, apply});
    return {staged:true, awaiting_user_approval:true, note:label};
  }
  return {error:'Unknown tool'};
}

function aiSystem(){
  const roster = state.deals.slice().sort(byPriority).map(d=>
    `${d.id} | ${d.company} | ${d._status} | score ${d._score} | ${d.country||'?'} | ${d.stage} | ${d.disposition}`
  ).join('\n');
  return `You are the pipeline analyst inside NextGen Kitchens' CRM. NextGen sells multi-vendor ordering and per-vendor settlement to food halls, food courts, airports and stadiums. You are talking to ${who()||'a teammate'}. Today is ${new Date().toISOString().slice(0,10)}.

HOW THIS PIPELINE IS SORTED
The sort key is "Buyable" — budget + decider + deadline — not subjective fit. Priority_Score = urgency (0-30) + budget certainty (0-25) + decider access (0-20) + account band (0-15, currently 0 for every row because no pricing model exists yet) + warm path (0-10).
Qualified = budget_allocated is not "none" AND signs_contract is known AND forcing_function is not "none" AND pain_if_nothing is not blank.
Status is computed, not typed: ACTIVE = qualified and inside the 20-row work-in-progress cap; PARKED = failed the gate or capped out; ARCHIVE = open-operating with no forcing function, or out of coverage with no warm path. A forcing date in the past does not count — that trigger has lapsed.

DRIVING THE SCREEN
You can change what is on the board, not just describe it. When the user says show / filter / switch to / just the / pull up, call set_view (or open_deal) so the screen matches your answer — then keep the reply to a sentence or two, because they can see the rows. Do not paginate a list they are already looking at.
When they ask a question instead ("how many…", "which of these…", "what should I do about…"), answer in text and leave the board alone.
For anything about a person's deals, use the exact "owner" argument on search_deals and set_view. Do not put a person's name in free text — text search also matches note authors, so it returns deals that person only commented on.
The board currently shows: view=${view}, owner=${owner||'all'}, status=${statusF||'all'}, country=${region||'all'}, search=${query||'none'}.

RULES OF THE HOUSE
- Never invent a value. If a field is "unknown" or blank, say so plainly — "unknown" is a research task, not a guess.
- Revenue, account band and the $800K gap are not computable yet: no pricing model exists. Say that rather than estimating.
- Answer from tool results, not from this roster summary alone — the roster below is an index, not the data.
- Be concise and specific. Name deals. Give numbers. Lead with the answer.
- For edits: make the smallest change that satisfies the request, and say what you changed. Never edit a deal the user did not clearly mean.
- Dates are YYYY-MM-DD. Never set a next_step_date in the past.

PIPELINE INDEX (${state.deals.length} deals — id | company | status | score | country | stage | disposition)
${roster}`;
}

function aiRender(){
  const body = $('aiBody');
  $('aiFoot').hidden = false;
  body.innerHTML = aiLog.map(m=>{
    if(m.kind==='user') return `<div class="msg user">${esc(m.text)}</div>`;
    if(m.kind==='tool') return `<div class="toolchip">${esc(m.text)}</div>`;
    if(m.kind==='err')  return `<div class="msg ai err">${esc(m.text)}</div>`;
    return `<div class="msg ai">${esc(m.text)}</div>`;
  }).join('') || `<div class="sub2">Ask anything about the 85 accounts — or tell me what to change.
    Try: “what should I work on this week?”, “which ACTIVE deals have no next step?”,
    “log a call with Nick Pacific and set the next step to send pricing by Friday”.</div>`;
  if(aiStaged.length){
    body.insertAdjacentHTML('beforeend', `<div class="stage"><h4>${aiStaged.length} change${aiStaged.length>1?'s':''} awaiting your OK</h4>
      <ul>${aiStaged.map(s=>`<li>${esc(s.label)}</li>`).join('')}</ul>
      <div class="row"><button class="btn primary" id="aiApply">Apply</button>
        <button class="btn quiet" id="aiDiscard">Discard</button></div></div>`);
    $('aiApply').addEventListener('click', async ()=>{
      const n = aiStaged.length;
      for(const s of aiStaged){ try{ await s.apply(); }catch(e){ toast('Change failed — '+e.message); } }
      aiStaged = []; aiLog.push({kind:'ai', text:`✓ Applied ${n} change${n>1?'s':''}.`});
      aiRender();
    });
    $('aiDiscard').addEventListener('click', ()=>{ aiStaged=[]; aiRender(); });
  }
  if(aiBusy) body.insertAdjacentHTML('beforeend', `<div class="toolchip"><span class="spin"></span> thinking…</div>`);
  body.scrollTop = body.scrollHeight;
}

async function aiSend(){
  const text = $('aiInput').value.trim();
  if(!text || aiBusy) return;
  $('aiInput').value = '';
  aiMsgs.push({role:'user', content:text});
  aiLog.push({kind:'user', text});
  aiBusy = true; aiRender();
  try{
    for(let turn=0; turn<AI.maxTurns; turn++){
      const {data:{session}} = await sb.auth.getSession();
      if(!session){ aiLog.push({kind:'err', text:'Your session expired. Reload and sign in again.'}); break; }
      const res = await fetch(AI.endpoint, {
        method:'POST',
        headers:{'content-type':'application/json',
                 'Authorization':'Bearer ' + session.access_token,
                 'apikey': CONFIG.SUPABASE_ANON_KEY},
        body: JSON.stringify({system:aiSystem(), tools:AI_TOOLS, messages:aiMsgs}),
      });
      if(!res.ok){
        const t = await res.text();
        let msg = `API error ${res.status}`;
        try{ msg += ' — ' + (JSON.parse(t).error?.message || t.slice(0,200)); }catch(e){ msg += ' — '+t.slice(0,200); }
        if(res.status===401) msg = 'Your session expired. Reload the page and sign in again.';
        if(res.status===404) msg = 'The AI service is not deployed yet (ask-claude Edge Function missing).';
        aiLog.push({kind:'err', text:msg});
        break;
      }
      const data = await res.json();
      // echo the assistant turn back verbatim — thinking blocks must survive unchanged
      aiMsgs.push({role:'assistant', content:data.content});
      const shownText = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
      if(shownText) aiLog.push({kind:'ai', text:shownText});
      if(data.stop_reason==='refusal'){ aiLog.push({kind:'err', text:'Claude declined this request.'}); break; }
      const calls = (data.content||[]).filter(b=>b.type==='tool_use');
      if(!calls.length) break;
      const results = [];
      for(const c of calls){
        let out;
        try{ out = await aiRunTool(c.name, c.input||{}); }
        catch(e){ out = {error:String(e.message||e)}; }
        aiLog.push({kind:'tool', text:`${c.name}(${Object.keys(c.input||{}).join(', ')})`});
        results.push({type:'tool_result', tool_use_id:c.id, content:JSON.stringify(out).slice(0,60000)});
      }
      aiRender();
      aiMsgs.push({role:'user', content:results});
    }
  }catch(e){
    const net = /Failed to fetch|NetworkError|CORS/i.test(String(e.message));
    aiLog.push({kind:'err',
      text: net ? 'Could not reach the AI service. Check your connection — if this persists the ask-claude Edge Function may be down or misconfigured.'
                 : 'Request failed — '+(e.message||e)});
  }
  aiBusy = false; aiRender();
}

$('aiBtn').addEventListener('click', ()=>{ $('ai').classList.add('open'); aiRender();
  setTimeout(()=>$('aiInput')?.focus(), 220); });
$('aiClose').addEventListener('click', ()=>$('ai').classList.remove('open'));
$('aiClear').addEventListener('click', ()=>{ aiMsgs=[]; aiStaged=[]; aiRender(); });
$('aiSend').addEventListener('click', aiSend);
$('aiInput').addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) aiSend(); });

/* ---------------- sign-in gate ----------------
   Access is enforced twice: this gate, and row-level security in the database
   that only accepts @nextgenkitchens.com identities. The second one is what
   actually protects the data — the gate is only the front door. */
const PANES = ['topbar','viewNav','viewNote','mainWrap'];
function showGate(msg){
  $('gate').hidden = false; PANES.forEach(i=>$(i).hidden = true);
  $('ai').classList.remove('open'); closeDrawer();
  if(msg) $('gateErr').textContent = msg;
  setTimeout(()=>$('emailIn')?.focus(), 60);
}
async function enterApp(){
  $('gate').hidden = true; PANES.forEach(i=>$(i).hidden = false);
  $('whoBtn').textContent = authUser.email;
  if(!booted){ booted = true; await loadAll(); subscribe(); }
}
async function handleSession(session){
  const email = (session?.user?.email || '').toLowerCase();
  if(!session){ authUser = null; booted = false; state.deals = []; showGate(); return; }
  if(!email.endsWith('@' + AUTH_DOMAIN)){
    authUser = null; await sb.auth.signOut();
    showGate(`That account is not an @${AUTH_DOMAIN} address. Use your work email account.`);
    return;
  }
  authUser = session.user;
  $('gateErr').textContent = '';
  await enterApp();
}
async function doSignIn(){
  const email = $('emailIn').value.trim().toLowerCase();
  const password = $('passIn').value;
  if(!email || !password){ $('gateErr').textContent = 'Enter your email and password.'; return; }
  if(!email.endsWith('@' + AUTH_DOMAIN)){
    $('gateErr').textContent = `Use your @${AUTH_DOMAIN} work email.`; return;
  }
  $('gateErr').textContent = 'Signing in…';
  $('signinBtn').disabled = true;
  const {error} = await sb.auth.signInWithPassword({email, password});
  $('signinBtn').disabled = false;
  if(error){
    $('passIn').value = '';
    $('gateErr').textContent = /invalid login/i.test(error.message)
      ? 'That email and password combination was not recognised. Ask Ash to reset it if you are stuck.'
      : error.message;
  } else { $('passIn').value = ''; }
}
$('signinBtn').addEventListener('click', doSignIn);
$('emailIn').addEventListener('keydown', e=>{ if(e.key==='Enter') $('passIn').focus(); });
$('passIn').addEventListener('keydown', e=>{ if(e.key==='Enter') doSignIn(); });
$('whoBtn').title = 'Sign out';
$('whoBtn').addEventListener('click', async ()=>{
  if(confirm('Sign out of the pipeline?')) await sb.auth.signOut();
});
sb.auth.onAuthStateChange((_evt, s)=>{ handleSession(s); });
handleSession((await sb.auth.getSession()).data.session);
</script>
